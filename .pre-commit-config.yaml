ci:
  # pre-commit.ci runs every hook over every file on its own runners and
  # autofixes by pushing a commit. The graph rebuild must not run there: the
  # committed graph carries the flavour of whichever platform last built it.
  skip: [graphify-update]
  autoupdate_schedule: "monthly"
  autoupdate_commit_msg: "👷: update pre-commit hooks"
  autofix_commit_msg: "🎨: pre-commit fixes"

default_stages: [pre-commit, pre-push]

repos:
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen
        additional_dependencies: [cz-conventional-gitmoji]

  - repo: meta
    hooks:
      - id: check-useless-excludes

  - repo: https://github.com/scientific-python/cookie
    rev: 2025.11.21
    hooks:
      - id: sp-repo-review

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-added-large-files
        # The committed code graph is a few MB of single-line JSON.
        exclude: ^graphify-out/graph\.json$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
        # graphify writes no trailing newline; adding one makes the hook and
        # the rebuild rewrite the file in turn, forever.
        exclude: ^graphify-out/graph\.json$
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: no-commit-to-branch
        args: ["--branch", "main", "--pattern", "^versions/.*"]
        always_run: true
        # Restrict to pre-commit so a push (e.g. a release tag) isn't mistaken for a commit.
        stages: [pre-commit]
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: "v1.10.0"
    hooks:
      - id: rst-backticks
      - id: rst-directive-colons
      - id: rst-inline-touching-normal

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.36.0
    hooks:
      - id: check-dependabot
      - id: check-github-workflows

  # The tutorials' source is MyST Markdown (docs/tutorials/*.md). Each .ipynb
  # is generated from it, with no outputs and numbered cell ids, only so the
  # Colab badges have a notebook to open. Never edit the .ipynb by hand.
  # Runs before ruff, which then lints the generated code.
  - repo: local
    hooks:
      - id: tutorial-ipynb
        name: generate tutorial .ipynb from .md
        language: python
        additional_dependencies: [jupytext==1.19.6, nbstripout==0.9.1]
        entry:
          bash -c 'for md; do jupytext -q --to ipynb "$md" && nbstripout
          "${md%.md}.ipynb"; done' --
        files: ^docs/tutorials/.*\.md$
        exclude: ^docs/tutorials/index\.md$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.9"
    hooks:
      # Run the linter
      - id: ruff-check
        types_or: [python, pyi, jupyter]
        args: ["--fix", "--show-fixes"]
      # Run the formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/adamchainz/blacken-docs
    rev: "1.20.0"
    hooks:
      - id: blacken-docs
        additional_dependencies: [black==23.*]

  - repo: https://github.com/rbubley/mirrors-prettier
    rev: "v3.7.4"
    hooks:
      - id: prettier
        types_or: [yaml, markdown, html, css, scss, javascript, json]
        args: [--prose-wrap=always]
        # graphify-out/graph.json: one line of JSON, which prettier would
        # reformat into hundreds of thousands.
        exclude: "^(docs/.*\\.md|graphify-out/graph\\.json)$"

  - repo: https://github.com/codespell-project/codespell
    rev: "v2.4.1"
    hooks:
      - id: codespell
        args: ["--toml", "pyproject.toml"]
        additional_dependencies: ["tomli"]
        # A typo in a source identifier should be reported at the source, not
        # from inside a generated file.
        exclude: ^graphify-out/graph\.json$

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.18
    hooks:
      - id: uv-lock

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3
    hooks:
      - id: taplo-format

  # Keeps the committed code graph (graphify-out/graph.json) in step with the
  # code. Like a formatter: if the graph changed, stage it and commit again.
  # Skip once with `SKIP=graphify-update git commit ...`.
  #
  # This `graphifyy==` pin is the only one in the repository;
  # .github/workflows/graphify.yml reads the version back out of this file.
  # No extras: `graphifyy[leiden]` clusters differently, so one contributor
  # with the extra installed would rewrite the whole graph on every commit.
  - repo: local
    hooks:
      - id: graphify-update
        name: graphify update
        language: python
        # graphifyy requires >=3.11.5,<3.15, so a pre-commit running on a newer
        # interpreter cannot install this hook. Pinned to the repository's own
        # Python (.python-version).
        language_version: python3.12
        additional_dependencies: ["graphifyy==0.9.119"]
        # PYTHONHASHSEED=0 pins community numbering; --force makes the rebuild
        # full rather than incremental, so it matches a fresh-clone build.
        entry: env PYTHONHASHSEED=0 graphify update . --force
        pass_filenames: false
        # Without always_run a commit that only deletes files does not rebuild,
        # and the deleted code stays in the graph. It also makes any `exclude:`
        # on this hook inert, so there is none.
        always_run: true
        # default_stages includes pre-push; without this the hook runs a second
        # full rebuild on every push, which can only repeat what the commit
        # already enforced.
        stages: [pre-commit]
