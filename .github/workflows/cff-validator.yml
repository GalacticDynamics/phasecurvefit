name: CITATION.cff

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Each push to main gets its own group, so merges never cancel each other
  # and main keeps a complete CI record. Other events (PRs, releases, manual
  # runs) keep the per-ref group and still supersede older runs.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha ||
    github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate CITATION.cff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Validate against the CFF schema
        uses: dieghernan/cff-validator@d8f85828214016ce6976e740b6e0504c0fdc4dbb # v5
