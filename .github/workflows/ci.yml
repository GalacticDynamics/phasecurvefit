name: CI

permissions:
  contents: read
  packages: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  # Each push to main gets its own group, so merges never cancel each other
  # and main keeps a complete CI record. All other events keep the per-ref
  # group and still supersede older runs.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha ||
    github.ref }}
  cancel-in-progress: true

env:
  # Many color libraries just need this to be set to any value, but at least
  # one distinguishes color depth, where "3" -> "256-bit color".
  FORCE_COLOR: 3

jobs:
  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --no-default-groups --group nox --group lint --locked

      - name: Run pre-commit
        run: uv run --frozen nox -s precommit

  smoke:
    name: Smoke Test (core dependencies only)
    runs-on: ubuntu-latest
    needs: [pre-commit]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      # Install the package with no extras or dependency groups (just pytest
      # to run the tests), so imports that are only satisfied transitively,
      # e.g. via unxt in the interop extra, fail here. `--noconftest` because
      # the shared conftests need test-group packages; `-o addopts=` drops
      # options that need test-group pytest plugins.
      - name: Run smoke tests
        env:
          PHASECURVEFIT_SMOKE_TESTS: "1"
        run: |
          uv run --isolated --no-project --with . --with pytest --with pytest-env \
            pytest tests/smoke --noconftest -o addopts= -p no:cacheprovider

  docs:
    # ReadTheDocs shows the tutorials' stored outputs without running them
    # (docs/conf.py). Off ReadTheDocs the docs build executes every notebook and
    # guide and fails on any cell error or Sphinx warning, so this job checks that
    # every notebook still runs with the current code.
    name: Docs build (executes notebooks)
    runs-on: ubuntu-latest
    needs: [pre-commit]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --no-default-groups --group nox --locked

      - name: Build the docs
        run: uv run --frozen nox -s docs

  tests:
    name: Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    needs: [pre-commit, smoke]
    permissions:
      contents: read
      packages: read
      id-token: write # Codecov OIDC upload; main is protected, so tokenless fails
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv sync --no-default-groups --group nox --group test --locked

      - name: Test package
        run: |
          uv run --frozen nox -s pytest -- --cov --cov-report=xml --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  test_oldest:
    name: Check Oldest Dependencies
    runs-on: ubuntu-latest
    needs: [pre-commit]
    permissions:
      contents: read
      packages: read
      id-token: write # Codecov OIDC upload; main is protected, so tokenless fails

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Test package
        run: |
          uv run --frozen --group test --resolution lowest-direct pytest --cov --cov-report=xml --cov-report=term --durations=20

      - name: Upload coverage report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true

  benchmark_smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    needs: [pre-commit]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"

      - name: Install
        run: |
          uv sync --no-default-groups --group test --locked

      # Correctness only: without --codspeed, pytest-codspeed's `benchmark`
      # fixture runs each benchmark body exactly once, so breakage surfaces
      # without timing noise or meaningful CI time.
      # (Timing lives in the CodSpeed `benchmark` job below.)
      - name: Run benchmarks once
        run: |
          uv run --frozen --no-default-groups --group test pytest tests/benchmarks/

  benchmark:
    name: Run Benchmarks
    runs-on: ubuntu-24.04
    needs: [pre-commit]
    if:
      github.event_name == 'workflow_dispatch' || (github.event_name ==
      'pull_request' && contains(github.event.pull_request.labels.*.name, '⏱️
      Run benchmarks')) || (github.event_name == 'push' && github.ref ==
      'refs/heads/main')
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v5.5.0

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
          run: uv run --group test pytest tests/benchmarks --codspeed

  status:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [pre-commit, tests, test_oldest, benchmark_smoke, docs]
    if: always()
    steps:
      - name: All required jobs passed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
